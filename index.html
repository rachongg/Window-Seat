<script>
(() => {

})();
const H = VIEW.H;
const GX = 18, GY = 0, GW = 324, GH = Math.round(H - VIEW.sill), FIN = GY + GH - 12, START_Y = Math.round(VIEW.top + 34);

const SY = (FIN - START_Y) / 344, mapY = y => START_Y + (y - 84) * SY;
const TW = 1440; // scenery tile width in canvas pixels

/* ---------- colour ---------- */
const CORNERS = { '000': [1, 1, 1], '100': [.89, .36, .38], '010': [.98, .83, .36], '001': [.31, .52, .84], '110': [.96, .6, .3], '101': [.6, .4, .74], '011': [.38, .71, .47], '111': [.5, .36, .28] };

  const p = { r: c.r / s, y: c.y / s, b: c.b / s };
  if (p.r > .72) return 'Red'; if (p.y > .72) return 'Yellow'; if (p.b > .72) return 'Blue';
  if (p.b < .18) return 'Orange'; if (p.r < .18) return 'Green'; if (p.y < .18) return 'Purple'; return 'Brown';
}
const css = (rgb, a = 1) => `rgba(${rgb.map(v => Math.round(v * 255)).join(',')},${a})`;
const PIG = { r: { r: 1, y: 0, b: 0, w: 0 }, y: { r: 0, y: 1, b: 0, w: 0 }, b: { r: 0, y: 0, b: 1, w: 0 }, w: { r: 0, y: 0, b: 0, w: 1 } };
const STICKER = { Purple: '#8f5fb3', Green: '#3f9a5c', Orange: '#e07f2e' };

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- scenery: four looping layers per stop ---------- */
function vgrad(g, y0, y1, stops, w) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); g.fillStyle = gr; g.fillRect(0, y0, w, y1 - y0); }
function glow(g, x, y, r, col, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
const wrap = (w, x, span, fn) => { fn(x); if (x < span) fn(x + w); if (x > w - span) fn(x - w); };
function poly(g, pts, fill) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = fill; g.fill(); }
function hills(g, w, base, amp, n, col, R) { const ph = R() * 6; g.beginPath(); g.moveTo(0, 1040); for (let x = 0; x <= w; x += 8) g.lineTo(x, base - amp * (.55 + .45 * Math.sin(x / w * Math.PI * 2 * n + ph)) * (.8 + .2 * Math.sin(x / w * Math.PI * 2 * (n + 2)))); g.lineTo(w, 1040); g.fillStyle = col; g.fill(); }
function tree(g, x, base, h, col) { g.fillStyle = col; g.beginPath(); g.arc(x, base - h * .6, h * .32, 0, 7); g.arc(x - h * .2, base - h * .45, h * .25, 0, 7); g.arc(x + h * .2, base - h * .45, h * .25, 0, 7); g.fill(); g.fillRect(x - h * .04, base - h * .35, h * .08, h * .35); }
function pine(g, x, base, h, col) { poly(g, [x, base - h, x + h * .3, base, x - h * .3, base], col); }

// painterly-real helpers: lit and shaded shapes, fractal ridgelines, noise clouds
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbS = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
// f < 1 darkens, f > 1 mixes towards white
function pShade(hex, f, a = 1) { const c = hexRGB(hex); return rgbS(f < 1 ? c.map(v => v * f) : c.map(v => v + (255 - v) * Math.min(1, f - 1)), a); }
function ridge(w, base, amp, rough, R, step = 6, f0 = 3) {

}
function ridgePath(g, w, ys, bottom, step = 6) { g.beginPath(); g.moveTo(0, bottom); ys.forEach((y, i) => g.lineTo(i * step, y)); g.lineTo(w, ys[0]); g.lineTo(w, bottom); g.closePath(); }
function fillRidge(g, w, ys, bottom, fill, step = 6) { ridgePath(g, w, ys, bottom, step); g.fillStyle = fill; g.fill(); }
function cloudSky(g, w, h, stops, cover, light, dark, R, alpha = 1) {
  vgrad(g, 0, h, stops, w);
  const lw = w >> 2, lh = h >> 2, c = mk(lw, lh), cx = c.getContext('2d'), im = cx.createImageData(lw, lh), d = im.data;
  const oct = []; let tot = 0;
  for (let o = 0, fx = 3, fy = 8; o < 5; o++, fx *= 2, fy *= 2) { const a = Math.pow(.5, o); tot += a; oct.push({ fx, fy, a, v: Float32Array.from({ length: fx * (fy + 1) }, R) }); }
  const L = hexRGB(light), D = hexRGB(dark), lo = 1 - cover - .1, hi = 1 - cover + .2;
  for (let y = 0; y < lh; y++) {
    const yy = y / lh, fade = 1 - Math.min(1, Math.max(0, (yy - .38) / .2));
    for (let x = 0; x < lw; x++) {
      let n = 0;
      for (const o of oct) { const tx = x / lw * o.fx, ty = yy * o.fy, kx = tx | 0, ky = ty | 0, ux = tx - kx, uy = ty - ky, sx = ux * ux * (3 - 2 * ux), sy = uy * uy * (3 - 2 * uy), r0 = ky * o.fx, r1 = r0 + o.fx, x1 = (kx + 1) % o.fx;
        n += o.a * ((o.v[r0 + kx] * (1 - sx) + o.v[r0 + x1] * sx) * (1 - sy) + (o.v[r1 + kx] * (1 - sx) + o.v[r1 + x1] * sx) * sy); }
      n /= tot;
      const cv = Math.min(1, Math.max(0, (n - lo) / (hi - lo))), k = cv * cv * (3 - 2 * cv) * fade, s = Math.min(1, Math.max(0, (n - .45) * 2.2 + yy * .5)), i = (y * lw + x) * 4;
      d[i] = L[0] + (D[0] - L[0]) * s; d[i + 1] = L[1] + (D[1] - L[1]) * s; d[i + 2] = L[2] + (D[2] - L[2]) * s; d[i + 3] = 255 * k * alpha;
    }
  }

}
function pWindow(g, x, y, ww, wh, lit, night, R) {
  let gr = g.createLinearGradient(0, y, 0, y + wh);
  if (lit) { gr.addColorStop(0, '#ffe1a0'); gr.addColorStop(1, '#f0a254'); glow(g, x + ww / 2, y + wh / 2, ww * 1.9, '255,196,120', night ? .5 : .25); }
  else if (night) { gr.addColorStop(0, '#2a3044'); gr.addColorStop(1, '#141826'); }
  else { gr.addColorStop(0, '#c4ced8'); gr.addColorStop(.5, '#7d8a98'); gr.addColorStop(1, '#3e4652'); }
  g.fillStyle = gr; g.fillRect(x, y, ww, wh);
  g.strokeStyle = night ? 'rgba(200,190,170,.5)' : 'rgba(245,245,240,.9)'; g.lineWidth = 3; g.strokeRect(x, y, ww, wh);
  g.beginPath(); g.moveTo(x + ww / 2, y); g.lineTo(x + ww / 2, y + wh); g.moveTo(x, y + wh * .45); g.lineTo(x + ww, y + wh * .45); g.lineWidth = 2; g.stroke();

}
function pHouse(g, x, base, bw, bh, wall, roof, lit, night, R) {
  const top = base - bh, rh = bw * (.34 + R() * .12), sd = bw * .2;
  poly(g, [x + bw, top, x + bw + sd, top - sd * .3, x + bw + sd, base - sd * .3, x + bw, base], pShade(wall, .6));
  poly(g, [x + bw / 2, top - rh, x + bw / 2 + sd, top - rh - sd * .3, x + bw + sd + 8, top - sd * .3, x + bw + 8, top + 2], pShade(roof, .72));
  let gr = g.createLinearGradient(0, top, 0, base); gr.addColorStop(0, pShade(wall, .8)); gr.addColorStop(.12, pShade(wall, 1)); gr.addColorStop(1, pShade(wall, .74)); g.fillStyle = gr; g.fillRect(x, top, bw, bh);
  const cx = x + bw * .7; g.fillStyle = pShade(roof, .55); g.fillRect(cx, top - rh * .85, bw * .1, rh * .6); g.fillStyle = pShade(roof, .4); g.fillRect(cx + bw * .07, top - rh * .85, bw * .03, rh * .6);
  gr = g.createLinearGradient(x, top - rh, x + bw * .8, top); gr.addColorStop(0, pShade(roof, 1.1)); gr.addColorStop(1, pShade(roof, .78));
  poly(g, [x - 8, top + 2, x + bw / 2, top - rh, x + bw + 8, top + 2], gr);

  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x, top + 2, bw, 6);
  const ww = bw * .22, wh = bh * .24;
  for (const [wx, wy] of [[.12, .16], [.66, .16], [.12, .56]]) pWindow(g, x + bw * wx, top + bh * wy, ww, wh, R() < lit, night, R);
  g.fillStyle = pShade(roof, .45); g.fillRect(x + bw * .64, base - bh * .4, bw * .18, bh * .4); g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + bw * .64, base - bh * .4, bw * .18, 3);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x - 4, base - 4, bw + sd + 4, 8);
}
function pTree(g, x, base, h, col, R, n = 22) {
  g.fillStyle = pShade(col, .4); g.fillRect(x - h * .03, base - h * .5, h * .06, h * .5);
  const cy = base - h * .62, rx = h * .32, ry = h * .34, bl = [];
  for (let i = 0; i < n; i++) { const a = R() * 6.283, rr = Math.sqrt(R()) * .85; bl.push([x + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr, h * (.1 + R() * .08)]); }

  for (const [bx, by, br] of bl) {
    const f = .55 + .55 * (1 - (by - cy + ry) / (2 * ry)) - .15 * (bx - x) / rx;
    const gr = g.createRadialGradient(bx - br * .35, by - br * .4, br * .1, bx, by, br); gr.addColorStop(0, pShade(col, Math.max(.4, f + .25))); gr.addColorStop(1, pShade(col, Math.max(.3, f - .2)));
    g.fillStyle = gr; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill();
  }
}
function pPine(g, x, base, h, col, R, snow) {
  g.fillStyle = pShade(col, .5); g.fillRect(x - h * .02, base - h * .2, h * .04, h * .2);
  for (let t = 0; t < 5; t++) {
    const ty = base - h + t * h * .17, tw = h * (.09 + t * .055), th = h * .28;
    const gr = g.createLinearGradient(x - tw, 0, x + tw, 0); gr.addColorStop(0, pShade(col, 1.12)); gr.addColorStop(1, pShade(col, .7));
    g.beginPath(); g.moveTo(x, ty); g.lineTo(x + tw, ty + th); g.lineTo(x + tw * .3, ty + th * .92); g.lineTo(x - tw * .2, ty + th); g.lineTo(x - tw, ty + th * .95); g.closePath(); g.fillStyle = gr; g.fill();
    if (snow) poly(g, [x, ty, x + tw * .45, ty + th * .5, x + tw * .1, ty + th * .42, x - tw * .55, ty + th * .55], 'rgba(238,243,250,.85)');
  }
}
// a fractal range, lit from the left, with an optional ragged snowline
function range(g, w, h, base, amp, rough, col, R, snowY, f0 = 3) {
  const ys = ridge(w, base, amp, rough, R, 6, f0);
  g.save(); ridgePath(g, w, ys, h); g.clip();
  vgrad(g, Math.min(...ys), h, [pShade(col, 1.08), col, pShade(col, .8)], w);
  if (snowY) { const sl = ridge(w, snowY, amp * .3, .75, R, 6, 12); g.beginPath(); ys.forEach((y, i) => g.lineTo(i * 6, y)); for (let i = sl.length - 1; i >= 0; i--) g.lineTo(i * 6, Math.max(ys[i], sl[i])); g.closePath(); const gr = g.createLinearGradient(0, base - amp, 0, snowY + amp * .3); gr.addColorStop(0, '#f6f7fb'); gr.addColorStop(1, '#d9dfec'); g.fillStyle = gr; g.fill(); }

  for (let k = 1; k <= 3; k++) {
    const sp = ridge(w, base + amp * (.15 + k * .28), amp * (.55 - k * .1), .6, R, 6, f0 + k); ridgePath(g, w, sp, h);
    g.fillStyle = `rgba(${k % 2 ? '36,40,78' : '255,255,255'},${k % 2 ? .16 : .07})`; g.fill();
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2; g.stroke();
  }
  const fd = g.createLinearGradient(0, base - amp * .3, 0, base + amp * 1.2); fd.addColorStop(0, `rgba(${hexRGB(col).join(',')},0)`); fd.addColorStop(1, `rgba(${hexRGB(col).join(',')},.55)`); g.fillStyle = fd; g.fillRect(0, 0, w, h);

}
function wetRoad(g, w, y, h, col, sky) {
  vgrad(g, y, h, [pShade(col, 1.15), col, pShade(col, .7)], w);
  const gr = g.createLinearGradient(0, y, 0, h); gr.addColorStop(0, `rgba(${sky},.28)`); gr.addColorStop(.4, `rgba(${sky},.06)`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, y, w, h - y);
}
function verge(g, w, y0, y1, col, R) {
  vgrad(g, y0, y1, [pShade(col, 1.1), col, pShade(col, .75)], w);

}

const SCENES = {
  home: {
    sky(g, w, h, R) { cloudSky(g, w, h, ['#8a9db0', '#b9c5cf', '#d9dedf'], .62, '#e4e8ec', '#7d8796', R); },
    far(g, w, h, R) { range(g, w, h, h * .5, 50, .5, '#93a3aa', R); fillRidge(g, w, ridge(w, h * .54, 14, .7, R, 6, 24), h, '#71857a'); },
    mid(g, w, h, R) {
